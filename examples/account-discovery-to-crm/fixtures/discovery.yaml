# Synthetic companies used to exercise each of the 12 named scenarios.
# None of these are real customers; the data is didactic.
#
# Scenario mapping:
#   acc_001 - ICP match (qualifies, new in CRM)
#   acc_002 - non-ICP (wrong industry: agency)
#   acc_003 - already in CRM (see examples/.../fixtures/crm-seed.yaml)
#   acc_004 / acc_004_dup - duplicate rows for the same company
#   acc_005 - missing employee data (insufficient_evidence)
#   acc_006 - stale buying signal (older than 90d)
#   acc_007 - ICP match, no signal, above min_evidence (qualifies)
#   acc_008 - ICP match where provider returns an incomplete contact (no email)
#   acc_009 - ICP match whose enrichment call pushes us over budget
#   acc_010 - ICP match where the CRM first write fails (fault injection in tests)

source_failures:
  - "linkedin_sales_navigator:429 rate_limit"

