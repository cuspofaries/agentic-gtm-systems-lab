# Demo values chosen to exercise the test scenarios, not recommendations.
# Every key is documented in docs/configuration.md.
version: "1.0.0"
company_positioning: |
  Fictional US B2B SaaS startup selling a sales-onboarding platform.
  Target: VP Sales, Head of Sales, Revenue Operations, Sales Enablement at
  mid-size B2B SaaS companies with a sales-assisted motion.

icp:
  employees_min: 20
  employees_max: 200
  industry_keywords:
    - saas
    - software
    - technology
  geographies:
    - US
  sales_motion: sales-assisted B2B

personas:
  - name: VP Sales
    titles_any_of: ["vp sales", "vice president, sales", "vp of sales"]
  - name: Head of Sales
    titles_any_of: ["head of sales"]
  - name: Revenue Operations
    titles_any_of: ["revenue operations", "revops", "rev ops"]
  - name: Sales Enablement
    titles_any_of: ["sales enablement"]

signal_policy:
  relevant_kinds: ["sales_hiring", "new_sales_leadership", "revenue_expansion"]
  max_signal_age_days: 90

exclusions:
  - name: not-for-profit
    reason: Out of ICP by motion; no revenue team.
    industry_keywords: ["nonprofit", "non-profit"]
  - name: consulting-agencies
    reason: Services businesses, not SaaS.
    industry_keywords: ["consulting", "agency"]

policy:
  enrichment_budget_cents: 50   # demo value: 5 calls at the fixture's 10¢, runs out on purpose. See docs/configuration.md
  require_signal_for_qualification: false
  require_approval_before_crm_write: true
  min_evidence_count: 2
  require_contact_email_for_create: false

# Only used with `--crm hubspot`.
crm:
  # HubSpot portals with GDPR enabled require a legal basis on every contact.
  # The fixture contacts are fictional people, so "Not applicable" is the truthful value.
  # For real contacts this is a compliance decision: set your own value.
  hubspot_contact_legal_basis: "Not applicable"

# GTM Brain: what we sell, which problems it solves, who might care. Used by
# `--opportunity` (docs/opportunity-intelligence.md); optional everywhere else.
offers:
  - id: sales-onboarding
    name: Sales onboarding platform
    target_problem: New sales hires take too long to reach quota because onboarding is ad hoc.
    value_proposition: Structured onboarding and coaching paths that shorten ramp time.
    pains: [slow-ramp, onboarding-at-scale]
    exclusions:
      - The company states it already uses a dedicated sales onboarding or enablement platform.
    evidence_expectations:
      - A dated page from or about the company that ties sales hiring or growth to onboarding, ramp time, training or coaching.

pain_points:
  - id: slow-ramp
    description: New sales reps take too long to become productive.
    evidence_terms: [ramp, ramp time, time to productivity, quota attainment, onboarding]
    supporting_events: [sales_hiring, new_sales_leadership]
    weakening_events: [hiring freeze, layoffs in sales]
  - id: onboarding-at-scale
    description: Onboarding many sales hires at once without a repeatable program.
    evidence_terms: [onboarding, training program, enablement, coaching, playbook, standardize]
    supporting_events: [sales_hiring, revenue_expansion]
    weakening_events: [evergreen posting, role outside sales]

buying_roles:
  - id: enablement-owner
    role: problem_owner
    title_hints: [Sales Enablement Manager, Head of Sales Enablement]
    why: Owns onboarding content and ramp programs.
    pains: [slow-ramp, onboarding-at-scale]
    personas: [Sales Enablement]
  - id: sales-sponsor
    role: sponsor
    title_hints: [VP Sales, Head of Sales]
    why: Carries the quota that slow ramp puts at risk.
    pains: [slow-ramp]
    personas: [VP Sales, Head of Sales]
  - id: revops-stakeholder
    role: stakeholder
    title_hints: [Revenue Operations]
    why: Integrates the tool with CRM and reports ramp metrics.
    pains: [slow-ramp, onboarding-at-scale]
    personas: [Revenue Operations]

signal_interpretation:
  - signal_kind: sales_hiring
    may_suggest: [onboarding-at-scale, slow-ramp]
    misleading_alternatives:
      - The posting is evergreen or old (reposted, no date in the text).
      - The role is not in sales (support, success, marketing).
      - The posting belongs to another company with a similar name.
  - signal_kind: new_sales_leadership
    may_suggest: [slow-ramp]
    misleading_alternatives:
      - The announcement is old; the page date is not the event date.
  - signal_kind: revenue_expansion
    may_suggest: [onboarding-at-scale]
    misleading_alternatives:
      - Funding or expansion with no stated plan to grow the sales team.
