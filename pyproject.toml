[project]
name = "gtm-lab"
version = "0.1.0"
description = "Agentic GTM systems laboratory - build, run, test and debug real-world GTM workflows"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "cuspofaries" }]
keywords = ["gtm", "sales", "agent", "crm", "pipeline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Developers",
]
dependencies = [
  "pydantic>=2.6",
  "typer>=0.12",
  "pyyaml>=6.0",
  "rich>=13.7",
]

[project.optional-dependencies]
agentic = [
  "anthropic>=2.12",
]
dev = [
  "anthropic>=2.12",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
gtm-lab = "gtm_lab.cli:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtm_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",  # line length handled by formatter
  "B008",  # typer.Option in defaults is the documented Typer pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N806"]  # function-scoped constants are conventional in test helpers

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "unit: fast unit tests with no I/O beyond temp SQLite",
  "integration: multi-component tests using fixtures end-to-end",
  "scenario: named failure/success scenarios from docs/failure-scenarios.md",
  "live_hubspot: hits a real HubSpot test portal; skipped unless GTM_LAB_LIVE_HUBSPOT=1",
]
